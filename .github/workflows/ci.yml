name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      # Installed rather than pulled in as an action: the version is then the
      # exact one used locally, and a linter cannot update itself into breaking
      # the build on its own schedule.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run

      # The acceptance tests live in here: two ingest runs give the same week,
      # an event outlives the file it came from, a browser history is read
      # while it is locked and left untouched, and no query string ever
      # reaches a column.
      - name: go test
        run: go test -race ./...

      - name: build
        run: go build ./...

  # No cgo, ever: a single static binary has to cross-compile without a build
  # runner per platform. This job is what stops that from rotting.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build ./cmd/spoor
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
