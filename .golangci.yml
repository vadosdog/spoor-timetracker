version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - errorlint
  settings:
    misspell:
      locale: UK
    errcheck:
      # Writing to stdout/stderr: if that fails there is nowhere left to
      # report it, and the exit code is already the answer.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests may ignore errors from cleanup they have already asserted on.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
